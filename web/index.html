<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journly</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="lock-screen" id="lock-screen" hidden>
  <form class="lock-box" id="lock-form" autocomplete="off">
    <h1 class="lock-brand">Journly</h1>
    <p class="lock-subtitle" id="lock-subtitle">Enter your password</p>
    <input type="password" id="lock-password" class="lock-input" placeholder="Password"
           autocomplete="current-password" aria-label="Password">
    <input type="password" id="lock-password-confirm" class="lock-input" placeholder="Confirm password"
           autocomplete="new-password" aria-label="Confirm password" hidden>
    <button type="submit" class="lock-submit" id="lock-submit">Unlock</button>
    <p class="lock-error" id="lock-error"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-head">
      <h1 class="brand">Journly</h1>
      <div class="sidebar-actions">
        <button class="icon-button" id="lock-button" type="button"
                title="Lock" aria-label="Lock">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.5" y="11" width="15" height="10" rx="1.5"></rect>
            <path d="M7.5 11V7.5a4.5 4.5 0 0 1 9 0V11"></path>
          </svg>
        </button>
        <button class="icon-button" id="theme-toggle" type="button"
                title="Toggle theme (&#8984;&#8679;L)" aria-label="Toggle theme">&#9789;</button>
      </div>
    </header>

    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="Search" autocomplete="off"
             spellcheck="false" aria-label="Search entries">
    </div>

    <nav class="entry-list" id="entry-list" aria-label="Entries"></nav>
  </aside>

  <main class="editor-pane">
    <div class="editor-head">
      <h2 class="entry-date" id="entry-date"></h2>
    </div>

    <textarea id="editor" class="editor" spellcheck="true" autocomplete="off"
              placeholder="Write." aria-label="Journal entry"></textarea>

    <footer class="status">
      <span id="word-count">0 words</span>
      <span id="save-state" class="save-state"></span>
    </footer>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
